<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorBridge - Vendors Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex">

    <aside class="w-64 min-h-screen p-6 border-r border-white/10 flex flex-col justify-between">
        <div>
            <h1 class="text-2xl font-black mb-10 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">VENDORBRIDGE</h1>
            <nav class="space-y-4">
                <a href="index.html" class="block py-3 px-4 rounded-xl text-slate-400 hover:text-white transition">Dashboard</a>
                <a href="vendors.html" class="block py-3 px-4 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/50 font-bold">Vendors</a>
            </nav>
        </div>
        <a href="#" onclick="logout()" class="block py-3 px-4 rounded-xl text-red-400 hover:bg-red-900/20 border border-red-900/50 transition text-center">Logout</a>
    </aside>

    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-10">
            <div>
                <p class="text-purple-500 text-sm font-bold uppercase tracking-widest">Directories</p>
                <h2 class="text-3xl font-bold text-white">Onboarded Corporate Vendors</h2>
            </div>
            <button onclick="document.getElementById('vendor-modal').classList.remove('hidden')" 
                    class="bg-white text-black px-6 py-3 rounded-full font-bold hover:bg-purple-400 transition">
                + Onboard Vendor
            </button>
        </header>

        <div class="glass-card p-8 rounded-3xl mb-10 w-64 border-l-4 border-purple-500">
            <p class="text-slate-400 text-sm font-medium">Active Partners</p>
            <h3 class="text-5xl font-black mt-2 text-white" id="val-vendor">0</h3>
        </div>

        <div class="glass-card rounded-3xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="border-b border-white/10">
                    <tr class="text-slate-400 text-xs uppercase tracking-widest">
                        <th class="p-6">Company Name</th>
                        <th class="p-6">Representative</th>
                        <th class="p-6">Email Endpoint</th>
                        <th class="p-6">Category Group</th>
                    </tr>
                </thead>
                <tbody id="vendor-table-body" class="text-slate-200">
                    <tr>
                        <td colspan="4" class="p-6 text-center text-slate-500">Loading directory entities...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="vendor-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden">
        <div class="glass-card p-8 rounded-3xl w-full max-w-md border border-white/10">
            <h3 class="text-xl font-bold mb-6 text-white">Onboard New Corporate Vendor</h3>
            <form id="vendorForm" onsubmit="saveVendor(event)">
                <div class="mb-4">
                    <label class="block text-xs uppercase text-slate-400 font-bold mb-2">Legal Company Name</label>
                    <input type="text" id="v_name" placeholder="e.g. Apex Logistics Ltd" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-purple-500" required>
                </div>
                <div class="mb-4">
                    <label class="block text-xs uppercase text-slate-400 font-bold mb-2">Contact Person Representative</label>
                    <input type="text" id="v_rep" placeholder="e.g. Sarah Jenkins" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-purple-500" required>
                </div>
                <div class="mb-4">
                    <label class="block text-xs uppercase text-slate-400 font-bold mb-2">Corporate Email Contact</label>
                    <input type="email" id="v_email" placeholder="e.g. info@apex.com" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-purple-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-xs uppercase text-slate-400 font-bold mb-2">Industry Sector Category</label>
                    <input type="text" id="v_cat" placeholder="e.g. Electrical Components" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-purple-500" required>
                </div>
                <div class="flex gap-4 justify-end">
                    <button type="button" onclick="document.getElementById('vendor-modal').classList.add('hidden')" class="px-5 py-2 rounded-xl text-sm font-semibold border border-white/10 text-slate-300">Cancel</button>
                    <button type="submit" class="bg-purple-600 text-white px-5 py-2 rounded-xl text-sm font-semibold hover:bg-purple-500 transition">Save Registry</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function loadVendors() {
            fetch('vendors.php')
            .then(res => res.json())
            .then(data => {
                let tbody = document.getElementById('vendor-table-body');
                document.getElementById('val-vendor').innerText = data.length;
                tbody.innerHTML = "";
                
                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-500">No corporate suppliers currently registered.</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="border-b border-white/5 hover:bg-white/5 transition">
                            <td class="p-6 font-bold text-white">${item.company_name}</td>
                            <td class="p-6 text-slate-300">${item.contact_person}</td>
                            <td class="p-6 text-slate-400"><code>${item.email}</code></td>
                            <td class="p-6">
                                <span class="px-3 py-1 rounded-full bg-purple-500/10 text-purple-300 text-xs border border-purple-500/20 font-semibold uppercase">
                                    ${item.category || 'Supplier'}
                                </span>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function saveVendor(e) {
            e.preventDefault();
            let payload = {
                company_name: document.getElementById('v_name').value,
                contact_person: document.getElementById('v_rep').value,
                email: document.getElementById('v_email').value,
                category: document.getElementById('v_cat').value
            };

            fetch('vendors.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(out => {
                if(out.status === 'success') {
                    document.getElementById('vendor-modal').classList.add('hidden');
                    document.getElementById('vendorForm').reset();
                    loadVendors();
                } else { alert("Error: " + out.message); }
            });
        }

        window.onload = loadVendors;
    </script>
</body>
</html>
