    <main class="flex-1 pl-64 w-full p-10">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-2xl font-bold">Vendors</h2>
                <p class="text-slate-400 text-sm">Manage supplier profiles and registrations</p>
            </div>
            <button onclick="document.getElementById('vendor-modal').classList.remove('hidden')" class="bg-white text-black px-6 py-3 rounded-full font-bold hover:bg-blue-400 transition text-sm">
                + Add Vendor
            </button>
        </header>

        <div class="glass-card rounded-3xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="border-b border-white/10">
                    <tr class="text-slate-400 text-xs uppercase tracking-widest">
                        <th class="p-6">Company Name</th>
                        <th class="p-6">Category</th>
                        <th class="p-6">Email</th>
                        <th class="p-6">Action</th>
                    </tr>
                </thead>
                <tbody id="vendor-table-body" class="text-slate-200"></tbody>
            </table>
        </div>
    </main>

    <div id="vendor-modal" class="hidden fixed inset-0 z-[1000] flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md shadow-2xl text-black">
            <h2 class="text-2xl font-bold mb-6">Register New Vendor</h2>
            <form id="vendorForm" onsubmit="saveVendor(event)">
                <input type="text" id="company_name" placeholder="Company Name" required class="w-full border border-gray-300 rounded-xl p-3 mb-3">
                <input type="text" id="contact_person" placeholder="Contact Person" required class="w-full border border-gray-300 rounded-xl p-3 mb-3">
                <input type="email" id="email" placeholder="Email Address" required class="w-full border border-gray-300 rounded-xl p-3 mb-3">
                <input type="text" id="category" placeholder="Category (e.g., IT, Construction)" required class="w-full border border-gray-300 rounded-xl p-3 mb-6">
                <button type="submit" class="w-full bg-black text-white py-3 rounded-full font-bold hover:bg-blue-600 transition">Register Vendor</button>
                <button type="button" onclick="document.getElementById('vendor-modal').classList.add('hidden')" class="w-full mt-3 text-gray-500 hover:text-black">Cancel</button>
            </form>
        </div>
    </div>

    <script>
       function loadVendors() {
    fetch('../backend/vendors.php', { method: 'GET' })
    .then(res => res.json())
    .then(data => {
        const tbody = document.getElementById('vendor-table-body');
        tbody.innerHTML = '';
        data.forEach(vendor => {
            tbody.innerHTML += `
                <tr class="border-b border-white/5">
                    <td class="p-6 font-bold text-white">${vendor.company_name}</td>
                    <td class="p-6 text-slate-400">${vendor.category}</td>
                    <td class="p-6 text-slate-400">${vendor.email}</td>
                    <td class="p-6">
                        <button onclick="viewVendorDetails(${vendor.id})" class="text-blue-400 hover:underline font-semibold cursor-pointer">
                            View
                        </button>
                    </td>
                </tr>`;
        });
    })
    .catch(err => console.error("Error loading vendors:", err));
}
function viewVendorDetails(vendorId) {
    console.log("Viewing Vendor ID:", vendorId);
    alert("Vendor ID: " + vendorId);
}

        function saveVendor(event) {
            event.preventDefault();
            const vendorData = {
                company_name: document.getElementById('company_name').value,
                contact_person: document.getElementById('contact_person').value,
                email: document.getElementById('email').value,
                category: document.getElementById('category').value
            };

            fetch('../backend/vendors.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(vendorData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Vendor Added!');
                    document.getElementById('vendor-modal').classList.add('hidden');
                    document.getElementById('vendorForm').reset();
                    loadVendors();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(err => console.error("Error saving vendor:", err));
        }

        window.onload = loadVendors;
    </script>
     <script>
    // Get the current page filename
    const path = window.location.pathname.split("/").pop(); 

    // Mapping of filename to element ID
    const navMap = {
        'index.html': 'nav-dashboard',
        'vendors.html': 'nav-vendors',
        'create_rfq.html': 'nav-create',
        'rfq_list.html': 'nav-list',
        'submit_quotation.html': 'nav-submit',
        'approvals.html': 'nav-approvals',
        'invoices.html': 'nav-invoices'
    };

    // Apply active class to the current page link
    if (navMap[path]) {
        const activeEl = document.getElementById(navMap[path]);
        activeEl.classList.add('bg-blue-600/20', 'text-blue-400', 'border', 'border-blue-500/50');
        activeEl.classList.remove('text-slate-400');
    }
</script>
